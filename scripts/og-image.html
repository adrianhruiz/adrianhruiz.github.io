<!doctype html>
<!-- Source for public/og-image.png (the link preview). Regenerate with:
     chromium --headless --allow-file-access-from-files --hide-scrollbars \
       --window-size=1200,630 --screenshot=public/og-image.png scripts/og-image.html -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; box-sizing: border-box; padding: 96px 100px;
    display: flex; flex-direction: column; justify-content: center; gap: 28px;
    background:
      radial-gradient(60% 70% at 50% -10%, rgba(19, 250, 255, .22), transparent 70%),
      radial-gradient(40% 50% at 85% -10%, rgba(0, 187, 250, .18), transparent 70%),
      #001736;
    color: #c8d6e8; font-family: 'Barlow', sans-serif;
  }
  .top { display: flex; align-items: center; gap: 32px; }
  img { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255, 197, 74, .7); }
  h1 { margin: 0; color: #fff; font: italic 800 104px/.9 'Barlow Condensed', sans-serif; text-transform: uppercase; }
  h1 span { color: #ffc54a; }
  p { margin: 0; max-width: 900px; font-size: 34px; line-height: 1.35; }
  b { color: #fff; font-weight: 600; }
  .url { position: absolute; left: 100px; bottom: 56px; font-size: 24px; color: #79d7fd; }
  .mark { position: absolute; right: 100px; bottom: 60px; width: 26px; height: 26px; background: #ffc54a; transform: skewX(-12deg); }
</style>
</head>
<body>
  <div class="top">
    <img src="../public/photo.webp" alt="" />
    <h1>Adrian <span>Hermosilla</span></h1>
  </div>
  <p>Software developer bringing <b>quality, security and control</b> to AI-assisted delivery.</p>
  <div class="url">adrianhruiz.github.io</div>
  <div class="mark"></div>
</body>
</html>
